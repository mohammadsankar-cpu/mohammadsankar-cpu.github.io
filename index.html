<!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mohammad Sankar</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
            min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      }
    .card {
            text-align: center;
      padding: 60px 80px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
}
    .avatar {
            width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      margin: 0 auto 24px;
}
    h1 { font-size: 2.4rem; font-weight: 700; margin-bottom: 10px; }
    .title { font-size: 1.1rem; color: #a78bfa; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 30px; }
        .divider { width: 50px; height: 3px; background: linear-gradient(90deg, #667eea, #764ba2); border-radius: 2px; margin: 0 auto 30px; }
    .links { display: flex; gap: 16px; justify-content: center; }
    .links a { display: inline-block; padding: 10px 24px; border-radius: 50px; text-decoration: none; font-size: 0.9rem; font-weight: 600; }
    .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
        .btn-outline { border: 1px solid rgba(255,255,255,0.3); color: #fff; }
        .footer { margin-top: 40px; font-size: 0.8rem; color: rgba(255,255,255,0.3); }
  </style>
    </head>
    <body>
      <div class="card">
        <div class="avatar">M</div>
        <h1>Mohammad Sankar</h1>
        <p class="title">Developer &amp; Creator</p>
        <div class="divider"></div>
        <div class="links">
          <a href="https://github.com/mohammadsankar-cpu" class="btn-primary">GitHub</a>
          <a href="mailto:mohammadsankar@gmail.com" class="btn-outline">Contact</a>
        </div>
        <p class="footer">Coming soon — something great is on the way.</p>
      </div>
    </body>
    </html>
